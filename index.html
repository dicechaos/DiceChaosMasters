<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var storedTheme = localStorage.getItem('dcm-theme');
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').setAttribute('content', storedTheme);
        } else {
          document
            .querySelector('meta[name="color-scheme"]')
            .setAttribute('content', 'light dark');
        }
      } catch (e) {}
    </script>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' data: blob: file:; worker-src 'self' blob:;"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Dice Chaos Masters — Parametric Polyhedral Die &amp; Insert Blank Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
