name: Build & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_flag: --win
            asset_globs: |
              release/*.exe
              release/*-portable.zip
              release/SHA256SUMS-Windows.txt
              release/latest*.yml
          - os: macos-latest
            platform_flag: --mac
            asset_globs: |
              release/*.dmg
              release/*-mac-*.zip
              release/SHA256SUMS-macOS.txt
              release/latest-mac*.yml
          - os: ubuntu-latest
            platform_flag: --linux
            asset_globs: |
              release/*.AppImage
              release/*.deb
              release/SHA256SUMS-Linux.txt
              release/latest-linux*.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux FUSE dependency (Ubuntu)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Run CAD test suite
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run test

      - name: Typecheck & build Electron bundles
        run: npm run build

      - name: Package installers (Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.platform_flag }} --publish never

      - name: Generate SHA256SUMS-Windows.txt
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $checksumLines = @()
          foreach ($file in Get-ChildItem -Path "release\*" -Include "*.exe", "*-portable.zip" -File | Where-Object { $_.Name -notlike "*uninstaller*" }) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksumLines += "$hash  $($file.Name)"
          }
          $checksumLines | Set-Content -Path "release/SHA256SUMS-Windows.txt" -Encoding UTF8

      - name: Generate SHA256SUMS-macOS.txt
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          files=(*.dmg *-mac-*.zip)
          if (( ${#files[@]} )); then
            shasum -a 256 "${files[@]}" > SHA256SUMS-macOS.txt
          fi

      - name: Generate SHA256SUMS-Linux.txt
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          files=(*.AppImage *.deb)
          if (( ${#files[@]} )); then
            shasum -a 256 "${files[@]}" > SHA256SUMS-Linux.txt
          fi

      - name: Upload assets to GitHub Release (Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ contains(github.ref_name, '-beta') && format('Dice Chaos Masters {0} (Public Beta)', github.ref_name) || format('Dice Chaos Masters {0}', github.ref_name) }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: ${{ matrix.asset_globs }}
