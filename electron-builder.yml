appId: com.dicechaos.masters
productName: Dice Chaos Masters
copyright: Copyright © 2026 Dice Chaos
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!electron/**'
  - '!dist/**'
  - '!release/**'
  - '!vitest.config.*'
  - '!electron.vite.config.*'
  - '!tsconfig*.json'
  - '!scripts/**'
  - '!coverage/**'
  - '!{CHANGELOG.md,README.md,RELEASE_NOTES.md}'
  - '!{.env,.env.*,.npmrc,npm-shrinkwrap.json}'
asarUnpack:
  - resources/**
  - out/renderer/assets/*.wasm
win:
  executableName: DiceChaosMasters
  icon: build/icon.ico
  artifactName: ${name}-${version}-win-${arch}-portable.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
mac:
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon.icns
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  extendInfo:
    NSCameraUsageDescription: Not used.
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  maintainer: Gus <dicechaos@users.noreply.github.com>
  category: Graphics
  desktop:
    entry:
      StartupWMClass: dice-chaos-masters
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}_${version}_${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: dicechaos
  repo: DiceChaosMasters
  releaseType: release
